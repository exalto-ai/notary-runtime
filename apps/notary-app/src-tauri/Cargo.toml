[package]
name = "notary-app"
version = "0.1.7"
description = "Guided desktop shell for Exalto Capture"
edition = "2024"
license = "MIT"

[lib]
name = "notary_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notary-core = { path = "../../../runtime/crates/notary-core", features = ["cli"] }
notary-updater = { path = "../../../runtime/crates/notary-updater" }
notaryctl = { path = "../../../runtime/crates/notaryctl" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
axum = "0.8"
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2.4"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2.9"
tokio = { version = "1", features = ["sync", "time", "process", "io-util", "net"] }
url = "2.5"
zeroize = "1.8"

[dev-dependencies]
notary-core = { path = "../../../runtime/crates/notary-core", features = ["test-utils"] }
tempfile = "3"
