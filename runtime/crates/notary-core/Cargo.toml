[package]
name = "notary-core"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Proxy-TLS protocol, capture format, and local verification for Notary"

[features]
cli = [
    "dep:argon2",
    "dep:chacha20poly1305",
    "dep:directories",
    "dep:keyring",
    "dep:rpassword",
]
# Compile-time gate for the isolated Docker E2E trust root. Normal binaries do
# not enable this, so the corresponding environment variable is inert there.
daemon-e2e = []
openapi = ["dep:utoipa"]
test-utils = []

[dependencies]
anyhow = { workspace = true }
argon2 = { workspace = true, optional = true }
bincode = "1.3"
base64 = { workspace = true }
bytes = { workspace = true }
chacha20poly1305 = { version = "0.10", optional = true }
directories = { version = "6.0", optional = true }
futures = "0.3"
hex = { workspace = true }
http = { workspace = true }
http-body = "1.0"
http-body-util = { workspace = true }
hyper = { version = "1.6", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
k256 = { workspace = true, features = ["ecdsa"] }
keyring = { version = "3.6", optional = true, features = [
    "apple-native",
    "windows-native",
    "linux-native-sync-persistent",
    "crypto-rust",
    "vendored",
] }
metrics = { workspace = true }
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-client"] }
opentelemetry_sdk = "0.32.1"
rand = "0.9"
rpassword = { workspace = true, optional = true }
rustls = "0.23"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tlsn = { path = "../../vendor/tlsn/crates/tlsn", features = ["mozilla-certs"] }
tlsn-formats = { path = "../../vendor/tlsn/crates/formats" }
tokio = { workspace = true, features = ["full"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["compat"] }
tracing = { workspace = true }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
url = { workspace = true }
utoipa = { workspace = true, optional = true }
webpki-roots = "1"
zip = { version = "8.4", default-features = false }
zeroize = { workspace = true }

[dev-dependencies]
dhat = "0.3"
rangeset = "0.4"
tempfile = { workspace = true }
tiktoken-rs = "0.12"
tls-server-fixture = { path = "../../vendor/tlsn/crates/tls-server-fixture" }
tlsn = { path = "../../vendor/tlsn/crates/tlsn", features = ["mozilla-certs", "test-utils"] }
uuid = { workspace = true, features = ["v4"] }
