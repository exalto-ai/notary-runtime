[package]
name = "notaryctl"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Thin REST client for the Notary daemon"

[[bin]]
name = "notaryctl"
path = "src/bin/notaryctl.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "string"] }
notary-updater = { path = "../notary-updater" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rpassword = "7.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["macros", "net", "rt-multi-thread", "time"] }
toml = "0.8"
url = "2.5"
uuid = { version = "1.16", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
base64 = "0.22"
tempfile = "3.20"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
