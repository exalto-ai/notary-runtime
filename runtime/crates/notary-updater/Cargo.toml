[package]
name = "notary-updater"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Authenticated Notary release checks and rollback-safe updates"
build = "build.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
fs2 = "0.4"
hex = "0.4"
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
tokio = { version = "1.45", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { version = "1.16", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
