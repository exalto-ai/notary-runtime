[package]
name = "notary-updater"
version.workspace = true
edition = "2024"
license = "MIT"
description = "Authenticated Notary release checks and rollback-safe updates"
build = "build.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
fs2 = { workspace = true }
hex = { workspace = true }
minisign-verify = "0.2"
reqwest = { workspace = true, features = ["rustls-tls", "stream"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
