[workspace]
members = [
    "crates/notaryctl",
    "crates/notary-core",
    "crates/notaryd",
    "crates/notary-server",
    "crates/notary-updater",
]
exclude = ["vendor/tlsn", "vendor/tlsn-utils"]
resolver = "2"

[workspace.package]
version = "0.1.12"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1.10"
clap = "4.5"
fs2 = "0.4"
hex = "0.4"
http = "1.3"
http-body-util = "0.1"
k256 = "0.13"
libc = "0.2"
metrics = { version = "0.24.6", default-features = false }
notary-core = { path = "crates/notary-core" }
notary-updater = { path = "crates/notary-updater" }
reqwest = { version = "0.12", default-features = false }
rpassword = "7.4"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
tokio = "1.45"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5"
utoipa = "5.5"
uuid = "1.16"
windows-sys = "0.61"
zeroize = "1.8"

# The vendored spansy carries a local patch for input-proportional parser
# stack usage; see vendor/tlsn-utils/README.md.
[patch."https://github.com/tlsnotary/tlsn-utils"]
spansy = { path = "vendor/tlsn-utils/spansy" }
