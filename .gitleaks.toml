title = "Notary secret scanning"

[extend]
useDefault = true

[[rules]]
id = "notary-private-artifact"
description = "Notary private evidence or local credential artifact"
path = '''(?i)(^|/)(bundles?|captures?|traces?)(/|$)|(^|/)notary-api\.db$|\.(llmcapture|llmbundle|bundle\.json|key|pem|sqlite)$'''
tags = ["notary", "private-artifact"]

[[rules.allowlists]]
description = "Vendored public certificate used by TLS parsing tests"
paths = ['''(^|/)runtime/vendor/tlsn/crates/tls-core/testdata/cert-digicert\.pem$''']

# The hosted trace API is a source module that happens to be named `traces`, so the directory
# clause above matches every file in it. Only its own Rust sources are exempt: a capture, key,
# or database dropped in that directory still trips the rule.
[[rules.allowlists]]
description = "Hosted trace API source module, not captured evidence"
paths = ['''(^|/)platform/crates/notary-api/src/traces/[^/]+\.rs$''']

[[allowlists]]
description = "Exact synthetic credentials and detector literals in Runtime tests"
regexTarget = "line"
regexes = [
  '''authorization: Bearer offline-(server|daemon-e2e)-secret''',
  '''x-notary-trusted-notary-key: 0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798''',
  '''"verification_key": "0279be667ef9dcbbac55a06295ce870b07029bfcdb2dce28d959f2815b16f81798"''',
  '''"eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiJmaXh0dXJlIn0\.signaturevalue1234"''',
  '''["']-----BEGIN (OPENSSH )?PRIVATE KEY-----["'] in text''',
  '''\("-----BEGIN (OPENSSH )?PRIVATE KEY-----", "-----END (OPENSSH )?PRIVATE KEY-----"\),''',
  '''b"-----begin (rsa |ec )?private key-----",''',
  '''\("pem", "-----BEGIN PRIVATE KEY-----"\)''',
]
